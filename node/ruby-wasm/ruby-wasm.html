<!-- node/ruby-wasm/ruby-wasm.html -->
<script type="text/javascript">
  RED.nodes.registerType("ruby-wasm", {
    category: "function",
    color: "#A61F17",
    defaults: {
      name: { value: "" },
      code: { value: 'puts "Hello, World!"' },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-diamond",
    label: function () {
      return this.name || "ruby-wasm";
    },
  });
</script>

<script type="text/html" data-template-name="ruby-wasm">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row" style="position: relative; min-height: 250px;">
    <label for="node-input-code" style="width: 100%"><i class="fa fa-code"></i> Code</label>
    <div style="height: 250px; min-height:150px;" class="node-text-editor" id="node-input-code-editor" ></div>
    <input type="hidden" id="node-input-code" />
  </div>
</script>

<script type="text/html" data-help-name="ruby-wasm">
  <p>A node that executes Ruby code using ruby-wasm.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload<span class="property-type">string</span></dt>
    <dd>The Ruby code to execute. If not provided, the code from the node's configuration will be used.</dd>
  </dl>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload<span class="property-type">string</span></dt>
    <dd>The result of the executed Ruby code.</dd>
  </dl>
  <h3>Details</h3>
  <p>This node uses <code>@ruby/wasm-wasi</code> to run Ruby code within Node-RED. You can write your Ruby script directly in the editor.</p>
  <p>Example:</p>
  <pre><code>puts "Hello from Ruby!"
3.times do |i|
  puts "Line #{i + 1}"
end
"Done"
</code></pre>
</script>
